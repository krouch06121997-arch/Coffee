Name: Build Android APK

on:
  push:
    branches:
      - main

jobs:
  build:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout Code
        uses: actions/checkout@v3

      - name: Setup Node.js
        uses: actions/setup-node@v3
        with:
          node-version: '18'

      - name: Install Dependencies
        run: npm install --legacy-peer-deps

      - name: Setup Java JDK
        uses: actions/setup-java@v3
        with:
          distribution: 'zulu'
          java-version: '17'

      # ជំហានទី ១: ធ្វើការ Sync កូដ Config ថ្មីចូល Android
      - name: Sync Capacitor
        run: |
          npx cap copy android
          npx cap sync android

      # ជំហានទី ២: ធ្វើការ Build APK ជាក់ស្តែង
      - name: Build Android APK
        run: |
          cd android
          chmod +x gradlew
          ./gradlew assembleDebug

      # ជំហានទី ៣: ទុក File APK ឱ្យយើងទាញយក
      - name: Upload APK
        uses: actions/upload-artifact@v3
        with:
          name: app-debug
          path: android/app/build/outputs/apk/debug/app-debug.apk
