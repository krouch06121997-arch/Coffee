<!DOCTYPE html>
<html lang="km">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0, maximum-scale=1.0, user-scalable=no">
    <title>Coffee POS</title>
    <style>
        * { margin: 0; padding: 0; box-sizing: border-box; }
        html, body { width: 100%; height: 100%; overflow: hidden; background: #fff; }
        iframe { width: 100%; height: 100%; border: none; }
    </style>
</head>
<body>
    <iframe src="http://localhost:8000/shop1/admin"></iframe>

    <!-- ហ្វាលសំឡេងแจ้งเตือนពេលមានការកុម្ម៉ង់ -->
    <audio id="orderSound" src="https://assets.mixkit.co/active_storage/sfx/2869/2869-preview.mp3" preload="auto"></audio>

    <script>
        // មុខងារសម្រាប់ចាក់សំឡេង
        function playOrderAlert() {
            const sound = document.getElementById('orderSound');
            sound.play().catch(error => {
                console.log("Audio play blocked or error: ", error);
            });
        }

        // ឧទាហរណ៍៖ បើអ្នកចង់ឱ្យវាបន្លឺសំឡេង ត-ភ្ជាប់ជាមួយ WebSocket 
        // ឬទាក់ទងគ្នាក្នុង iframe 
        window.addEventListener('message', function(event) {
            if (event.data === 'NEW_ORDER') {
                playOrderAlert();
            }
        });
    </script>
</body>
</html>
