name: Build Android APK

on:
  push:
    branches:
      - main

jobs:
  build:
    runs-on: ubuntu-latest

    steps:
      - name: Checkout Code
        uses: actions/checkout@v4

      - name: Setup Node.js
        uses: actions/setup-node@v4
        with:
          node-version: '18'

      - name: Setup Java JDK
        uses: actions/setup-java@v4
        with:
          distribution: 'temurin'
          java-version: '17'

      - name: Install Capacitor CLI
        run: |
          npm install
          npm install @capacitor/core@5 @capacitor/cli@5 @capacitor/android@5

      - name: Initialize Capacitor
        run: |
          npx cap init "Coffee POS" "com.coffeepos.app" --web-dir public

      - name: Add Android Platform
        run: |
          npx cap add android

      - name: Build Android APK
        env:
          GRADLE_OPTS: "-Dorg.gradle.daemon=false -Dorg.gradle.jvmargs='-Xmx2048m -XX:MaxMetaspaceSize=512m'"
        run: |
          cd android
          chmod +x gradlew
          ./gradlew assembleDebug --stacktrace

      - name: Upload APK Artifact
        uses: actions/upload-artifact@v4
        with:
          name: Coffee-POS-App
          path: android/app/build/outputs/apk/debug/app-debug.apk
